name: Package CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
jobs:
  discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
      - run: cargo test --locked --manifest-path crates/discovery/Cargo.toml
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ichinya/lekalo-adapter-sdk/.github/actions/package-contract@5dccba0f460834e767c63ce89750a6611fb7431a
        with:
          host: 9eb07ce8f21f96a9a160d382ac6280b9fa0fbcbe
